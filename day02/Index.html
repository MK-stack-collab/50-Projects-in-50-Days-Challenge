<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <p>Fill in your details</p>

        <div class="form-group">

            <label for="name">Name:</label>
            <input type="text" placeholder="Enter your name" id="nameinput">

            <label for="age">Age:</label>
            <input type="number" placeholder="Enter age" id=" ageinput">

            <label for="course">Course:</label>
            <input type="text" placeholder="Enter course of study" id="courseinput">

            <label for="score">Score:</label>
            <input type="number" placeholder="Enter score" id="scoreinput">

        </div>

        <button type="submit" id="btn">Submit</button>

        <p id="info"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
