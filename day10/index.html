<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Grade Calculator</h2>
        
        <div class="input-group">
            <label for="earned">Score Earned:</label>
            <input type="number" id="score" placeholder="e.g. 45">
        </div>

        <div class="input-group">
            <label for="total">Total Score:</label>
            <input type="number" id="overall" placeholder="e.g. 50">
        </div>

        <button id="calc-btn">Calculate Grade</button>

        <div class="result-box">
            <p>Percentage: <span id="percentage">-</span></p>
            <p>Letter Grade: <span id="letter">-</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
